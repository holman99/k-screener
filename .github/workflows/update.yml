name: 데이터 갱신 및 배포

on:
  schedule:
    # 한국시간 08:00 / 16:00 / 20:00 (아래는 UTC 표기). GitHub 사정으로 5~30분 늦게 시작될 수 있습니다.
    - cron: "0 23 * * *"   # 08:00 KST
    - cron: "0 7 * * *"    # 16:00 KST
    - cron: "0 11 * * *"   # 20:00 KST
  workflow_dispatch:        # 'Run workflow' 버튼으로 수동 갱신
  push:
    branches: [main]
    paths-ignore: ["README.md", "*.txt"]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write            # 자동 실행이 60일 뒤 꺼지지 않도록 다시 켜 두는 용도

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 구성요소 설치
        run: pip install -r requirements.txt

      - name: 지난번 데이터 불러오기 (주가·뉴스·업종 캐시)
        uses: actions/cache@v4
        with:
          path: cache
          key: data-v2-${{ github.run_id }}
          restore-keys: data-v2-

      - name: 데이터 받기 + 지표·업종·뉴스 계산 + 페이지 생성
        env:
          TZ: Asia/Seoul
        run: python build.py

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: 자동 실행 유지
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
